# Zazzu :: hyprlock

$font = JetBrainsMono Nerd Font
$red = rgb(c1121f)
$red_hi = rgb(e53946)
$fg = rgb(d7d7de)
$dim = rgb(8b8b96)

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/zazzu-dark-red.png
    color = rgb(8, 8, 10)
    blur_passes = 1
    blur_size = 4
}

input-field {
    monitor =
    size = 340, 44
    outline_thickness = 1
    inner_color = rgb(10, 10, 13)
    outer_color = $red
    check_color = $red_hi
    fail_color = $red_hi
    font_color = $fg
    font_family = $font
    rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##5a5a66">password</span>
    fail_text = <span foreground="##e53946">access denied</span>
    dots_size = 0.20
    dots_spacing = 0.38
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 104
    color = $red
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = $font
    font_size = 15
    color = $dim
    position = 0, 118
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##7f0d17">◤</span>  ZAZZU // ANALYSIS WORKSTATION  <span foreground="##7f0d17">◥</span>
    font_family = $font
    font_size = 13
    color = $dim
    position = 0, -20
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 12
    color = $dim
    position = 30, 30
    halign = left
    valign = bottom
}
